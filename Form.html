<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Compila il form per essere registrato</h1>
    <form onsubmit="alert('Registrazione avvenuta con successo!'); return false;">
    <div>
        <input type="text" placeholder="Il Tuo Nome">
    </div>
    <div>
        <input type="text" placeholder="Il Tuo Cognome">
    </div>
    <div>
        <input type="text" placeholder="La tua Email">
    </div>
    <div>
        <input type="password" placeholder="La tua Password">
    </div>
    <div>
        <input type="date" placeholder="La tua Data di Nascita">
    </div>
    <div>
        <input type="number" placeholder="Il Tuo Numero di Telefono">
    </div>
    <div>
        <p>Seleziona il tuo genere musicale preferito:</p>
        <input type="checkbox" id="rock" name="genere" value="rock">
        <label for="rock">Rock</label>
        <input type="checkbox" id="jazz" name="genere" value="jazz">
        <label for="jazz">Jazz</label>
        <input type="checkbox" id="pop" name="genere" value="pop">
        <label for="pop">Pop</label>
    </div>
    <div>
        <p>Clicca giù per accettare i termini e le condizioni:</p>
        <input type="radio" id="accetta" name="termini" value="accetta">
        <label for="accetta">Accetto i termini e le condizioni</label>
    </div>
    
    <button type="submit">Invia</button>
    </form>
</body>
    

</html>
